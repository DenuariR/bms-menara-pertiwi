name: Mobile Tab Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
      - name: Uji tab mobile
        env:
          MOB_ADMIN_USER: ${{ secrets.MOB_ADMIN_USER }}
          MOB_ADMIN_PASS: ${{ secrets.MOB_ADMIN_PASS }}
        run: node scripts/mobile-tab-check.mjs
