name: CSP Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pasang Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
      - name: Cek CSP
        env:
          BASE_URL: https://dcm.denuriramadhan.my.id/
        run: node scripts/csp-check.mjs
