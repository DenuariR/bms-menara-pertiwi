name: Admin Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm init -y
          npm install playwright
          npx playwright install chromium
      - name: Ukur admin
        env:
          ADMIN_CHECK_USER: ${{ secrets.ADMIN_CHECK_USER }}
          ADMIN_CHECK_PASS: ${{ secrets.ADMIN_CHECK_PASS }}
        run: node scripts/admin-check.mjs
