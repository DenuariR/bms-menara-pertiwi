name: Verify Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Periksa keystore dari secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          test -s release.jks
          keytool -list -v -keystore release.jks -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | head -25
          rm -f copy.jks
          keytool -importkeystore \
            -srckeystore release.jks -srcstorepass "$STORE_PASS" -srcalias "$KEY_ALIAS" -srckeypass "$KEY_PASS" \
            -destkeystore copy.jks -deststoretype PKCS12 -deststorepass "$STORE_PASS" -destalias "$KEY_ALIAS" -destkeypass "$KEY_PASS"
          test -s copy.jks
          echo "Keystore, store password, dan key password cocok."
