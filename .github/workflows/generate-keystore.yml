name: Generate Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Buat keystore rilis
        run: |
          set -e
          KS_PASS=$(openssl rand -base64 24 | tr -d '/+=')
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=')
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias dcm \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KS_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=DCM Menara Pertiwi, OU=Engineering, O=Menara Pertiwi, L=Jakarta, ST=DKI Jakarta, C=ID"
          base64 -w0 release.jks > keystore-base64.txt
          printf '{"storePassword":"%s","keyAlias":"dcm","keyPassword":"%s"}' "$KS_PASS" "$KEY_PASS" > passwords.json
          echo "Keystore dibuat dengan alias dcm."

      - name: Simpan keystore sementara
        uses: actions/upload-artifact@v4
        with:
          name: dcm-release-keystore
          path: |
            release.jks
            keystore-base64.txt
            passwords.json
          if-no-files-found: error
          retention-days: 1
