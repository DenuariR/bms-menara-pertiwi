name = "daily-checklist-monitoring"
main = "src/index.js"
workers_dev = true
preview_urls = true
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "daily-checklist-db"
database_id = "7903f509-b687-4e20-a0cd-80876c70d10e"
# SESSION_SECRET disimpan sebagai Cloudflare Secret: wrangler secret put SESSION_SECRET

# Lapisan kedua rate limit login di edge Cloudflare (sebelum menyentuh Worker/D1)
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[routes]]
pattern = "dcm.denuriramadhan.my.id/*"
zone_name = "denuriramadhan.my.id"

[[routes]]
pattern = "dcm.eng-prtw.web.id/*"
zone_name = "eng-prtw.web.id"
